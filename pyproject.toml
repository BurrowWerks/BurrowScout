[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "burrowscout"
version = "0.1.0"
description = "BurrowScout is an open-source Python data collection and processing tool designed to gather publicly available wage, salary, award, and employment-market information from permitted web sources. The project provides a structured pipeline for retrieving source data, extracting relevant employment and remuneration fields, validating and normalising records, removing duplicates, and preserving provenance so that every data point can be traced back to its original source. BurrowScout is being developed incrementally from a single-source web scraper into a modular, multi-source data collection platform with configurable scheduling, logging, error handling, historical run tracking, structured exports, and extensible scraper adapters. Its primary initial use case is collecting wage and pay-rate information relevant to employment in South Australia, with the longer-term goal of supplying reliable structured labour-market data to other BurrowWerks projects such as BurrowForage, while remaining useful as an independent data collection tool. BurrowScout prioritises responsible data collection, transparent source attribution, maintainable architecture, and compliance with source-specific access requirements."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Richard Martin" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
