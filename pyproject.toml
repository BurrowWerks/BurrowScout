[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "burrowscout"
version = "0.1.0"
description = "BurrowScout is an open-source Python tool for collecting permitted public job and wage information from approved sources. Version 0.1.0 implements a bounded I WORK FOR SA scraper that preserves source salary wording, validates responses and extracted records, records provenance metadata, and writes structured JSON output."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Richard Martin" }
]
dependencies = [
    "requests>=2.34.2,<3",
    "beautifulsoup4>=4.15.0,<5"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
